[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclasslife"
version = "0.0.1"
description = "Typed Python client for the Classlife API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "PyClasslife contributors" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
    "black>=24",
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
